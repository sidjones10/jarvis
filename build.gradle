plugins {
    id 'java'
    id 'application'
}

group = 'com.jarvis'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.jarvis.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.jarvis.Main'
    }
}
